aid: catalyst
name: Catalyst
description: 'Catalyst is a customer success platform for SaaS companies, giving customer success and revenue
  teams a single workspace to unify product usage, CRM, and support data, track customer health scores,
  automate playbooks, and drive retention and expansion. Catalyst merged with Totango to form a combined
  customer growth platform. This is an Accel-backed cloud-SaaS company profile in the API Evangelist
  network; Catalyst runs a customer-facing web application (app.catalyst.io) but does not currently
  publish a public developer API, OpenAPI, or SDKs.'
